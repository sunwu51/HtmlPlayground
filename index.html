<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground with Monaco Editor</title>
</head>

<body>
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        .body {
            display: flex;
            align-items: stretch;
            flex: 1 1 auto;
            min-height: 0;
            margin: 0
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex: 0 0 50%;
            height: 100%;
            min-width: 260px;
            resize: both;
            overflow: auto;
            transition: flex-basis 0.2s ease, min-width 0.2s ease;
        }

        .body.input-collapsed .wrapper {
            flex-basis: 0;
            min-width: 0;
            overflow: hidden;
            resize: none;
        }

        .container1,
        .container2,
        .container3 {
            flex: 0 0 30%;
            min-height: 200px
        }

        .container1::before {
            content: 'html'
        }

        .container2::before {
            content: 'js'
        }

        .container3::before {
            content: 'css'
        }

        .preview {
            flex: 1 1 auto;
            height: auto;
        }

        iframe {
            border: 1px solid skyblue;
        }

        button {
            padding: 0.5rem 1rem;
            background-color: #fffaf0;
            border-radius: 0.5rem;
            box-shadow: 2px 2px;
        }
        button:active {
            box-shadow: 0 0;
        }

        .toggle-panel-btn {
            align-self: stretch;
            width: 18px;
            padding: 0;
            border-radius: 0;
            cursor: pointer;
            z-index: 1;
        }

        .actions {
            flex: 0 0 auto;
            padding: 8px;
        }
    </style>

    <div class="body">
        <div class="wrapper">
            <div class="container1"></div>
            <div class="container3"></div>
            <div class="container2"></div>
        </div><button id="toggleInputBtn" class="toggle-panel-btn" type="button">&lt;</button><iframe class="preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
    </div>
    <div class="actions">
        <button id="cpBtn1">Copy Shared Link</button>
        <button id="cpBtn2">Copy Embed Link</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/1.0.11/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.0/min/vs/loader.min.js"></script>
    <script>
        var url = window.location.origin + window.location.pathname;
        // New links keep data after '#' (never sent to the server, so no server URL length limit);
        // fall back to '?' so old links still work.
        const hashParams = new URLSearchParams(window.location.hash.slice(1));
        const hasHashData = ['js', 'css', 'html'].some(k => hashParams.has(k));
        const params = hasHashData ? hashParams : new URL(window.location.href).searchParams;
        const hasQueryData = !hasHashData && ['js', 'css', 'html'].some(k => params.has(k));
        let jsValue = '', cssValue = '', htmlValue = '';
        let isExpanded = params.get('expanded') !== '0';
        params.forEach((value, name) => {
            if (name === 'js') jsValue = decode(value);
            if (name === 'css') cssValue = decode(value);
            if (name === 'html') htmlValue = decode(value);
        });
        function encode(str) {
            try {
                // base64url: no chars that need escaping, and no '+' for URLSearchParams to turn into a space
                return btoa(pako.deflate(str, { to: 'string' }))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } catch (e) {
                return encodeURIComponent(str);
            }
        }
        function decode(str) {
            try {
                // Accepts both base64url (new links) and standard base64 (old links).
                // Old links made by other tools may be percent-encoded twice (e.g. '%253D'),
                // so undo one extra layer; this is a no-op for plain base64/base64url.
                let b64 = decodeURIComponent(str).replace(/-/g, '+').replace(/_/g, '/');
                b64 += '='.repeat((4 - b64.length % 4) % 4);
                return pako.inflate(atob(b64), { to: 'string' });
            } catch (e) {
                return str;
            }
        }
        var iframe = document.querySelector('.preview');
        var bodyEl = document.querySelector('.body');
        var toggleInputBtn = document.getElementById('toggleInputBtn');
        var layoutEditors = () => {
            if (window.editor1) window.editor1.layout();
            if (window.editor2) window.editor2.layout();
            if (window.editor3) window.editor3.layout();
        };
        function applyExpandedState() {
            bodyEl.classList.toggle('input-collapsed', !isExpanded);
            toggleInputBtn.textContent = isExpanded ? '<' : '>';
            toggleInputBtn.title = isExpanded ? 'Collapse Input' : 'Expand Input';
            toggleInputBtn.setAttribute('aria-expanded', String(isExpanded));
            setTimeout(layoutEditors, 220);
        }
        function buildShareUrl() {
            var htmlB64 = encode(editor1.getValue());
            var jsB64 = encode(editor2.getValue());
            var cssB64 = encode(editor3.getValue());
            return `${url}#js=${jsB64}&css=${cssB64}&html=${htmlB64}${isExpanded ? '' : '&expanded=0'}`;
        }
        toggleInputBtn.onclick = () => {
            isExpanded = !isExpanded;
            applyExpandedState();
        };
        applyExpandedState();
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            var editor1 = monaco.editor.create(document.querySelector('.container1'), { language: 'html', theme: 'vs-dark' });
            var editor2 = monaco.editor.create(document.querySelector('.container2'), { language: 'javascript', theme: 'vs-dark' });
            var editor3 = monaco.editor.create(document.querySelector('.container3'), { language: 'css', theme: 'vs-dark' });
            var onchange = () => {
                var html = editor1.getValue(); var js = editor2.getValue(); var css = editor3.getValue();
                iframe.srcdoc = "<html><meta charset=\"utf-8\"><style>" + css + "<\/style>" + html + "<script>" + js + "<\/script><\/html>";
            };
            editor1.setValue(htmlValue);
            editor2.setValue(jsValue);
            editor3.setValue(cssValue);
            enhance(editor1);
            enhance(editor2);
            enhance(editor3);
            function enhance(editor) {
                editor.onDidChangeModelContent = onchange;
                editor.onKeyUp(onchange);
                editor.setValue = new Proxy(editor.setValue, {
                    apply(target, thisArg, args) {
                        target.apply(thisArg, args);
                        onchange();
                    }
                });
            }
            onchange();
            window.editor1 = editor1;
            window.editor2 = editor2;
            window.editor3 = editor3;
            if (hasQueryData) {
                // Rewrite old '?' links to the new '#' format without reloading
                history.replaceState(null, '', buildShareUrl());
            }
            window.addEventListener('resize', () => {
                layoutEditors();
            });
        })
        const cpBtn1 = document.getElementById('cpBtn1');
        const cpBtn2 = document.getElementById('cpBtn2');
        cpBtn1.onclick = () => {
            var src = buildShareUrl();
            navigator.clipboard.writeText(src).then(function () {
                alert('Copyed ~');
            }, function (err) {
                console.error(err);
            });
        }
        cpBtn2.onclick = () => {
            var src = buildShareUrl();
            var iframeStr = `<iframe src="${src}" height="730"
    allow="clipboard-write"
    sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"></iframe>`;
            navigator.clipboard.writeText(iframeStr).then(function () {
                alert('Copyed ~');
            }, function (err) {
                console.error(err);
            });
        }
    </script>
</body>

</html>
